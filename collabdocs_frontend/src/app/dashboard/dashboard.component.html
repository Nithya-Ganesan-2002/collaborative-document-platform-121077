<div class="dashboard-container">
  <h2>Your Documents</h2>
  <button class="primary" routerLink="/editor/new">New Document</button>
  <div *ngIf="loading">Loading...</div>
  <div class="docs-list" *ngIf="!loading">
    <div class="doc-card" *ngFor="let doc of docs">
      <h3>{{ doc.title }}</h3>
      <div>
        <button (click)="goTo(doc)">Edit</button>
      </div>
    </div>
    <div *ngIf="docs.length === 0">
      <p>No documents yet. Click 'New Document' to create one.</p>
    </div>
  </div>
</div>
