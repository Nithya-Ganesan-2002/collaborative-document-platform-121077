<div class="editor-container">
  <h2>{{ docId === 'new' || !docId ? 'New Document' : 'Edit Document' }}</h2>
  <form (ngSubmit)="saveDoc()">
    <div>
      <label>Title</label>
      <input [(ngModel)]="title" name="title" required />
    </div>
    <div>
      <label>Content</label>
      <quill-editor [(ngModel)]="content" name="content" [style]="{height: '260px'}"></quill-editor>
    </div>
    <div class="editor-actions">
      <button type="submit" class="save">Save</button>
      <button type="button" *ngIf="docId && docId !== 'new'" (click)="deleteDoc()" class="delete">Delete</button>
      <button type="button" (click)="openShareDialog()" [disabled]="isNew" class="share">Share</button>
    </div>
  </form>
  <app-share-dialog *ngIf="showShare"
    [sharedWith]="sharedWith"
    (sharedWithChange)="onSharedWithChange($event)"
    (closed)="onShareClosed()"></app-share-dialog>
</div>
